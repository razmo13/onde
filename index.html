<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Onde Musique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Onde">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app — scrolling view, docked mini player above a 3-tab bar, sheets slide up from the bottom */
:root{
  --ink:#000000; --deck:#141316; --deck-2:#201E24; --line:#2C2A31; --mute:#A09CA8; --text:#F5F3F7;
  --accent:#FF8A4C; --accent-ink:#1B0E06; --scrim:rgba(8,6,14,.66); --danger:#FF6B7A;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --tabs-h:58px; --mini-h:64px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,label:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:currentColor;flex:none}
.app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tabs-h) + var(--mini-h) + 40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;flex:1;min-width:0;text-wrap:balance}
.brand{display:inline-flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),#C24BFF,var(--accent))}
.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.icon:hover{background:var(--deck)}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:26px 0 12px;text-wrap:balance}
.art{position:relative;overflow:hidden;background:var(--deck);flex:none}
.art::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 70% 120%,transparent 0 9px,rgba(255,255,255,.07) 9px 10px)}
.art.round{border-radius:50%!important}
.art .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:rgba(255,255,255,.9);z-index:1}
.art .glyph{position:absolute;inset:0;display:grid;place-items:center;z-index:1;color:#fff}
/* home */
.shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.short{display:flex;align-items:center;gap:10px;background:var(--deck);border-radius:8px;overflow:hidden;text-align:left;min-width:0;height:56px}
.short:hover{background:var(--deck-2)}
.short .art{width:56px;height:56px}
.short b{font-weight:600;font-size:13px;line-height:1.25;padding-right:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:138px;gap:14px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.shelf::-webkit-scrollbar{display:none}
.card{display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0}
.card .art{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px}
.card b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--mute);font-size:12px;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.artist{align-items:center;text-align:center}
/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;text-align:left;width:100%}
.row .art{width:50px;height:50px;border-radius:6px}
.row .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .meta b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .meta b{color:var(--accent)}
.row .meta span{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row .side{display:flex;align-items:center;gap:2px;color:var(--mute)}
.heart-sm{color:var(--accent);display:inline-flex}
.heart-sm svg{width:14px;height:14px;fill:currentColor}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px;flex:none}
.empty{color:var(--mute);padding:28px 8px;text-align:center;line-height:1.5;max-width:34ch;margin:0 auto}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.chip{padding:7px 14px;border-radius:999px;background:var(--deck);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px;margin:10px 0 4px}
.toolbar button{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:999px;cursor:pointer}
.pill.ghost{background:var(--deck);color:var(--text)}
.pill input{display:none}
/* search */
.field{position:relative}
.field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink)}
.search{width:100%;box-sizing:border-box;background:var(--text);color:var(--ink);border:0;border-radius:10px;padding:12px 14px 12px 42px;font:inherit;font-size:16px;font-weight:500}
.search::placeholder{color:#6B6585}
.moods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mood{height:96px;border-radius:10px;padding:12px;text-align:left;font-family:var(--display);font-weight:800;font-size:18px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-start}
.mood span{position:relative;z-index:1;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.mood i{position:absolute;right:-14px;bottom:-14px;width:70px;height:70px;border-radius:8px;transform:rotate(22deg);box-shadow:0 4px 14px rgba(0,0,0,.35)}
/* collection */
.chead{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:4px}
.chead .art{width:min(62vw,230px);aspect-ratio:1;max-width:100%;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.chead .art.round{width:min(52vw,200px)}
.ctitle{align-self:stretch}
.ctitle h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.ctitle p{margin:6px 0 0;color:var(--mute);font-size:13px}
.cact{display:flex;align-items:center;gap:6px;align-self:stretch;margin-top:2px}
.cact .grow{flex:1}
.bigplay{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.bigplay svg{width:26px;height:26px}
.mode{color:var(--mute)}
.mode.active{color:var(--accent)}
/* mini + tabs */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(to top,var(--ink) 55%,rgba(0,0,0,0));padding-bottom:env(safe-area-inset-bottom,0px)}
.mini{margin-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px));background:var(--deck-2);border-radius:10px;padding:7px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.mini .art{width:42px;height:42px;border-radius:6px}
.mini .meta{min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.mini .meta b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .meta span{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{position:absolute;left:10px;right:10px;bottom:0;height:2px;background:rgba(255,255,255,.12)}
.mini .bar i{display:block;height:100%;width:0;background:var(--text)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabs-h);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mute);font-weight:500}
.tab[aria-current="page"]{color:var(--text)}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--deck);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto;animation:up .22s ease-out}
.modal::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.mhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mhead .art{width:46px;height:46px;border-radius:6px}
.mhead b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead span{color:var(--mute);font-size:13px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 2px;text-align:left;font-weight:500;border-radius:8px}
.mi:hover{background:var(--deck-2)}
.mi .art{width:44px;height:44px;border-radius:6px}
.mi .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi small{color:var(--mute);font-weight:400}
.mi.danger{color:var(--danger)}
.mi.sel{color:var(--accent)}
.mtitle{font-family:var(--display);font-weight:600;font-size:18px;margin:4px 0 10px;text-align:center}
.form{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.form input{background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px 14px;font:inherit;font-size:16px}
.form .err{color:var(--danger);font-size:13px;min-height:1em;margin:-4px 0 0}
.form .btns{display:flex;gap:10px;justify-content:flex-end}
/* player */
.sheet{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;flex-direction:column;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet .glow{position:absolute;inset:0 0 35%;opacity:.5;pointer-events:none;z-index:-1}
.stop{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}
.stop div{min-width:0}
.stop small{display:block;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.stop b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{width:min(100%,380px);aspect-ratio:1;max-width:100%;border-radius:14px;margin:auto auto 26px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.big canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.wrap{max-width:380px;width:100%;margin-inline:auto}
.now{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.now h1{font-family:var(--display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.now p{margin:4px 0 0}
.now p button{color:var(--mute)}
.now p button:hover{color:var(--text);text-decoration:underline}
.liked{color:var(--accent)}
.seek{margin-top:18px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:24px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--text) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--text)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--text)}
.times{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctrls .icon{width:50px;height:50px}
.ctrls .icon svg{width:28px;height:28px}
.ctrls .mode svg{width:24px;height:24px}
.play{width:70px;height:70px;border-radius:50%;background:var(--text);color:var(--ink);display:grid;place-items:center}
.play svg{width:32px;height:32px}
.one{position:relative}
.one::after{content:"1";position:absolute;top:9px;right:9px;font-size:9px;font-weight:700}
.extra{display:flex;justify-content:space-between;margin-top:14px;color:var(--mute)}
.extra button{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:8px 4px}
.extra .on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + var(--mini-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:40;max-width:calc(100% - 40px);box-sizing:border-box}
.qlabel{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.04em;margin:22px 0 6px;display:flex;justify-content:space-between;align-items:center}
@media (min-width:760px){.moods{grid-template-columns:repeat(3,1fr)}.shortcuts{grid-template-columns:repeat(3,1fr)}.chead{flex-direction:row;align-items:flex-end;flex-wrap:wrap}.ctitle{flex:1;align-self:auto}}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.modal{animation:none}}
</style>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<div class="app"><main id="view" tabindex="-1"></main></div>

<div class="dock">
  <div class="mini" id="mini" hidden>
    <button class="art" id="miniArt" aria-label="Ouvrir le lecteur" data-act="open-player"></button>
    <button class="meta" data-act="open-player"><b id="miniT"></b><span id="miniA"></span></button>
    <button class="icon" id="miniLike" data-act="like-current" aria-label="J'aime"></button>
    <button class="icon" id="miniPlay" data-act="toggle" aria-label="Lecture"></button>
    <div class="bar"><i id="miniBar"></i></div>
  </div>
  <nav class="tabs" aria-label="Navigation">
    <button class="tab" data-act="tab" data-v="home"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg>Accueil</button>
    <button class="tab" data-act="tab" data-v="search"><svg class="i" viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.3 12.5l5.3 5.3 1.4-1.4-5.3-5.3A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>Rechercher</button>
    <button class="tab" data-act="tab" data-v="library"><svg class="i" viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm4.2 1.4 1.9-.6 5.7 16.8-1.9.7z"/></svg>Bibliothèque</button>
  </nav>
</div>

<div class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Lecture en cours">
  <div class="glow" id="glow"></div>
  <div class="stop">
    <button class="icon" data-act="close-player" aria-label="Réduire le lecteur"><svg class="i" viewBox="0 0 24 24"><path d="M6.4 8.6 12 14.2l5.6-5.6L19 10l-7 7-7-7z"/></svg></button>
    <div><small>Lecture depuis</small><b id="ctxName">Bibliothèque</b></div>
    <button class="icon" data-act="more-current" aria-label="Plus d'options"></button>
  </div>
  <div class="big art" id="bigArt"><canvas id="viz"></canvas></div>
  <div class="wrap">
    <div class="now">
      <div style="min-width:0"><h1 id="bigT"></h1><p><button id="bigA" data-act="artist-current"></button></p></div>
      <button class="icon" id="bigLike" data-act="like-current" aria-label="J'aime"></button>
    </div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position dans le titre">
      <div class="times"><span id="cur">0:00</span><span id="tot">0:00</span></div>
    </div>
    <div class="ctrls">
      <button class="icon mode" id="shuf" data-act="shuffle" aria-label="Lecture aléatoire"></button>
      <button class="icon" data-act="prev" aria-label="Titre précédent"></button>
      <button class="play" id="play" data-act="toggle" aria-label="Lecture"></button>
      <button class="icon" data-act="next" aria-label="Titre suivant"></button>
      <button class="icon mode" id="rep" data-act="repeat" aria-label="Répéter"></button>
    </div>
    <div class="extra">
      <button id="timerBtn" data-act="timer"></button>
      <button data-act="queue"></button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="files" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple hidden>
<audio id="audio" preload="auto" playsinline></audio>

<script>
/* ---- Owner lock: only this Telegram account can use the app ---- */
const OWNER_ID='';/* ton identifiant Telegram, ex. '123456789' */
(function(){
  const W=window.Telegram&&window.Telegram.WebApp;
  const uid=W&&W.initDataUnsafe&&W.initDataUnsafe.user?String(W.initDataUnsafe.user.id):null;
  if(!OWNER_ID||uid===OWNER_ID)return;
  document.body.innerHTML='<div style="height:100%;display:grid;place-items:center;text-align:center;padding:24px;background:#000;color:#F5F3F7;font-family:system-ui,sans-serif"><div><div style="font-size:22px;font-weight:700;margin-bottom:8px">Accès réservé</div><div style="color:#A09CA8">Cette app est privée.</div></div></div>';
  try{W&&W.ready()}catch(e){}
  window.__ondeLocked=true;
})();
</script>

/* ---- demo audio, synthesized on the device ---- */
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const mtof=m=>440*Math.pow(2,(m-69)/12);
async function synth(spec){
  const sr=22050,beat=60/spec.bpm,bars=8,dur=bars*4*beat*2;
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const ctx=new OAC(1,Math.ceil(sr*(dur+.5)),sr);
  const master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);
  const r=rng(spec.seed),scale=[0,3,5,7,10,12,15],prog=[0,-4,3,-2].map(x=>spec.root+x);
  const note=(t,f,len,type,vol)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(master);o.start(t);o.stop(t+len+.05)};
  const kick=t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(master);o.start(t);o.stop(t+.35)};
  const mel=[];for(let i=0;i<16;i++)mel.push(r()<.7?scale[Math.floor(r()*scale.length)]:null);
  for(let rep=0;rep<2;rep++)for(let b=0;b<bars;b++){
    const root=prog[b%4],t0=(rep*bars+b)*4*beat;
    for(let k=0;k<4;k++){kick(t0+k*beat);note(t0+k*beat+beat/2,mtof(root-24),beat*.45,'sine',.35)}
    [0,4,7].forEach(iv=>note(t0,mtof(root+iv-12),beat*3.8,'sine',.06));
    if(rep>0||b>=4)for(let s=0;s<8;s++){const m=mel[(b*8+s)%16];if(m!==null)note(t0+s*beat/2,mtof(root+m),beat*.4,spec.wave,spec.wave==='square'?.05:.12)}
  }
  const buf=await ctx.startRendering();
  const d=buf.getChannelData(0),n=d.length,ab=new ArrayBuffer(44+n*2),v=new DataView(ab);
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,d[i]));v.setInt16(44+i*2,s*32767,true)}
  return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));
}

const player={ctx:[],pos:-1,ctxName:'',ctxKey:'',up:[],shuffle:store.get('shuf',false),repeat:store.get('rep','off'),timer:null,timerEnd:0,endOfTrack:false,
  cur(){return lib.get(this.ctx[this.pos])}};
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function playContext(ids,startId,name,key){
  if(!ids.length)return;
  let list=ids.slice();
  if(player.shuffle){const rest=list.filter(x=>x!==startId);list=startId?[startId,...shuffled(rest)]:shuffled(list)}
  player.ctx=list;player.ctxName=name;player.ctxKey=key;
  player.pos=Math.max(0,startId?list.indexOf(startId):0);
  load(player.ctx[player.pos]);
}
let loadToken=0;
async function load(id){
  const t=lib.get(id);if(!t)return;
  const my=++loadToken;
  lib.pushRecent(id);paintPlayer();refreshRows();
  if(!t.url){
    if(t.demo){$('#miniA').textContent='Préparation du son…';try{t.url=await synth(t)}catch(e){toast('Ce navigateur ne peut pas générer les titres de démo.');return}}
    else if(t.blob)t.url=URL.createObjectURL(t.blob);
    else{toast('Ce fichier n’est plus disponible. Importe-le à nouveau.');return}
  }
  if(my!==loadToken)return;
  audio.src=t.url;
  try{await audio.play()}catch(e){toast('Touche lecture pour démarrer.')}
  mediaSession(t);paintPlayer();
}
function next(auto){
  if(player.up.length){const id=player.up.shift();const at=player.pos+1;player.ctx.splice(at,0,id);player.pos=at;return load(id)}
  if(player.pos+1>=player.ctx.length){
    if(player.repeat==='all'&&player.ctx.length){player.pos=0;return load(player.ctx[0])}
    audio.pause();if(auto)audio.currentTime=0;paintPlayer();return;
  }
  player.pos++;load(player.ctx[player.pos]);
}
function prev(){
  if(audio.currentTime>3||player.pos<=0){audio.currentTime=0;return}
  player.pos--;load(player.ctx[player.pos]);
}
function toggle(){
  if(!player.cur()){const ids=lib.recent.length?lib.recent:lib.tracks.map(t=>t.id);return playContext(ids,ids[0],'Écoutés récemment','recent')}
  audio.paused?audio.play().catch(()=>{}):audio.pause();
}
audio.addEventListener('play',paintPlayer);audio.addEventListener('pause',paintPlayer);
audio.addEventListener('ended',()=>{
  if(player.endOfTrack){player.endOfTrack=false;paintTimer();toast('Minuteur terminé. Bonne nuit.');return}
  if(player.repeat==='one'){audio.currentTime=0;audio.play();return}
  next(true);
});
audio.addEventListener('loadedmetadata',()=>{const t=player.cur();if(t&&isFinite(audio.duration))t.dur=audio.duration});
let dragging=false;
audio.addEventListener('timeupdate',()=>{
  const p=audio.duration?audio.currentTime/audio.duration:0;
  $('#miniBar').style.width=(p*100)+'%';
  if(!dragging){$('#seek').value=p*1000;$('#seek').style.setProperty('--p',(p*100)+'%');$('#cur').textContent=fmt(audio.currentTime)}
  $('#tot').textContent=fmt(audio.duration);
});
$('#seek').addEventListener('input',e=>{dragging=true;const v=e.target.value;e.target.style.setProperty('--p',(v/10)+'%');$('#cur').textContent=fmt(v/1000*(audio.duration||0))});
$('#seek').addEventListener('change',e=>{if(audio.duration)audio.currentTime=e.target.value/1000*audio.duration;dragging=false});
function mediaSession(t){
  if(!('mediaSession'in navigator))return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Onde'});
    navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack',prev);navigator.mediaSession.setActionHandler('nexttrack',()=>next());}catch(e){}
}
function setShuffle(on){
  player.shuffle=on;store.set('shuf',on);
  const cur=player.ctx[player.pos];
  if(cur){const before=player.ctx.slice(0,player.pos+1),rest=player.ctx.slice(player.pos+1);player.ctx=before.concat(on?shuffled(rest):rest)}
}
function setTimer(min){
  clearTimeout(player.timer);player.timer=null;player.timerEnd=0;player.endOfTrack=false;
  if(min==='end'){player.endOfTrack=true}
  else if(min>0){player.timerEnd=Date.now()+min*60000;player.timer=setTimeout(()=>{audio.pause();player.timerEnd=0;paintTimer();toast('Minuteur terminé. Bonne nuit.')},min*60000)}
  paintTimer();
}
function paintTimer(){
  const b=$('#timerBtn');const on=player.endOfTrack||player.timerEnd;
  b.classList.toggle('on',!!on);
  b.innerHTML=ic('moon')+(player.endOfTrack?'Fin du titre':player.timerEnd?Math.max(1,Math.ceil((player.timerEnd-Date.now())/60000))+' min':'Minuteur');
}

  const ar=lib.artists().filter(a=>has(a.name));

  if(!tr.length&&!ar.length&&!pl.length)return `<div class="empty"><b>Rien pour « ${esc(query.trim())} »</b>Vérifie l’orthographe, ou essaie un nom d’artiste.</div>`;
  setCtx('search','Résultats de recherche',tr);
  let h='';
  if(ar.length)h+=`<h2>Artistes</h2><div class="list">${ar.map(a=>`<button class="row" data-act="open" data-k="artist:${esc(a.name)}">${art(a.hue,'round',`<span class="ini" style="font-size:16px">${esc(initials(a.name))}</span>`)}<span class="meta"><b>${esc(a.name)}</b><span>Artiste</span></span><span></span></button>`).join('')}</div>`;
  if(pl.length)h+=`<h2>Playlists</h2><div class="list">${pl.map(p=>`<button class="row" data-act="open" data-k="pl:${esc(p.id)}">${art(lib.plArt(p))}<span class="meta"><b>${esc(p.name)}</b><span>Playlist · ${p.tracks.length} titre${p.tracks.length>1?'s':''}</span></span><span></span></button>`).join('')}</div>`;
  if(tr.length)h+=`<h2>Titres</h2><div class="list">${tr.map(id=>trackRow(id,'search')).join('')}</div>`;
  return h;
}

function vLibrary(){
  let items=[];
  if(libFilter==='all'||libFilter==='playlists'){
    items.push({k:'liked',name:'Titres likés',sub:`Playlist · ${lib.liked.size} titre${lib.liked.size>1?'s':''}`,art:likedArt(),at:Infinity});
    lib.playlists.forEach(p=>items.push({k:'pl:'+p.id,name:p.name,sub:`Playlist · ${p.tracks.length} titre${p.tracks.length>1?'s':''}${p.example?' · exemple':''}`,art:art(lib.plArt(p)),at:p.at}));
  }
  if(libFilter==='all'||libFilter==='artists')lib.artists().forEach(a=>items.push({k:'artist:'+a.name,name:a.name,sub:'Artiste',art:art(a.hue,'round',`<span class="ini" style="font-size:16px">${esc(initials(a.name))}</span>`),at:0}));
  if(libFilter==='all'||libFilter==='files'){const n=lib.files().length;items.push({k:'files',name:'Mes fichiers',sub:n?`${n} fichier${n>1?'s':''} sur ce téléphone`:'Importer depuis l’app Fichiers',art:`<span class="art" style="background:var(--deck-2);display:grid;place-items:center;width:50px;height:50px;border-radius:6px">${ic('file')}</span>`,at:n?1:-1})}
  if(libSort==='az')items.sort((a,b)=>a.k==='liked'?-1:b.k==='liked'?1:a.name.localeCompare(b.name,'fr'));
  else items.sort((a,b)=>b.at-a.at);
  const chip=(f,l)=>`<button class="chip" data-act="libf" data-f="${f}" aria-pressed="${libFilter===f}">${l}</button>`;
  return `<div class="top"><h1>Bibliothèque</h1><button class="icon" data-act="import" aria-label="Importer de la musique">${ic('file')}</button><button class="icon" data-act="new-pl" aria-label="Créer une playlist">${ic('plus')}</button></div>
  <div class="chips">${chip('all','Tout')}${chip('playlists','Playlists')}${chip('artists','Artistes')}${chip('files','Fichiers')}</div>
  <div class="toolbar"><button data-act="libsort">${ic('sort')}${libSort==='az'?'Ordre alphabétique':'Récents'}</button></div>
  <div class="list">${items.map(it=>`<button class="row" data-act="open" data-k="${esc(it.k)}">${it.art.replace('class="art','class="art')}<span class="meta"><b>${esc(it.name)}</b><span>${esc(it.sub)}</span></span><span></span></button>`).join('')}</div>`;
}

function collection(k){
  let title,kind,ids,head,empty,owner=null;
  if(k==='liked'){title='Titres likés';kind='Playlist';ids=lib.likedIds();head=likedArt();empty=['Aucun titre liké','Touche le cœur sur un titre pour le retrouver ici.']}
  else if(k==='files'){title='Mes fichiers';kind='Sur ce téléphone';ids=lib.files();head=`<span class="art" style="background:${artBg(220)}"><span class="glyph">${ic('file')}</span></span>`;empty=['Aucun fichier','Importe des MP3, M4A ou WAV depuis l’app Fichiers. Nomme-les « Artiste - Titre » pour un classement automatique.']}
  else if(k.startsWith('pl:')){const p=lib.pl(k.slice(3));if(!p)return `<div class="empty"><b>Playlist introuvable</b>Elle a peut-être été supprimée.</div>`;owner=p;title=p.name;kind=p.example?'Playlist · exemple':'Playlist';ids=p.tracks.filter(id=>lib.get(id));head=art(lib.plArt(p));empty=['Cette playlist est vide','Ajoute des titres avec le menu ⋯ à côté de chaque morceau.']}
  else if(k.startsWith('artist:')){title=k.slice(7);kind='Artiste';ids=lib.byArtist(title);head=art(hueOf(title),'round',`<span class="ini" style="font-size:56px">${esc(initials(title))}</span>`);empty=['Aucun titre','Cet artiste n’a plus de titres dans ta bibliothèque.']}
  else if(k.startsWith('mood:')){title=k.slice(5);kind='Ambiance';ids=lib.byMood(title);head=art((MOODS[title]||{hue:0}).hue);empty=['Rien ici pour l’instant','']}
  setCtx(k,title,ids);
  const total=ids.reduce((s,id)=>s+(isFinite(lib.get(id).dur)?lib.get(id).dur:0),0);
  return `<div class="top"><button class="icon" data-act="back" aria-label="Retour">${ic('back')}</button></div>
  <div class="chead">${head}<div class="ctitle"><h1>${esc(title)}</h1><p>${esc(kind)} · ${ids.length} titre${ids.length>1?'s':''}${total?' · '+longFmt(total):''}</p></div>
  <div class="cact">${owner?`<button class="icon" data-act="pl-menu" data-id="${esc(owner.id)}" aria-label="Options de la playlist">${ic('more')}</button>`:''}${k==='files'?`<button class="pill ghost" data-act="import">${ic('plus')}Importer</button>`:''}<span class="grow"></span>
  <button class="icon mode ${player.shuffle?'active':''}" data-act="shuffle" aria-label="Lecture aléatoire" aria-pressed="${player.shuffle}">${ic('shuffle')}</button>
  ${ids.length?`<button class="bigplay" data-act="play-ctx" data-ctx="${esc(k)}" aria-label="Tout lire">${ic(player.ctxKey===k&&!audio.paused?'pause':'play')}</button>`:''}</div></div>
  <div class="list" style="margin-top:14px">${ids.length?ids.map(id=>trackRow(id,k,{hideArtist:k.startsWith('artist:')})).join(''):`<div class="empty"><b>${empty[0]}</b>${empty[1]}</div>`}</div>`;
}

function vQueue(){
  const cur=player.cur();
  const nextIds=player.ctx.slice(player.pos+1,player.pos+31);
  setCtx('queue','File d’attente',player.ctx);
  return `<div class="top"><button class="icon" data-act="back" aria-label="Retour">${ic('back')}</button><h1>File d’attente</h1></div>
  ${cur?`<div class="qlabel">En cours</div><div class="list">${trackRow(cur.id,'queue')}</div>`:`<div class="empty"><b>Rien en lecture</b>Lance un titre pour voir la suite ici.</div>`}
  ${player.up.length?`<div class="qlabel">Ajoutés par toi<button data-act="clear-up" style="color:var(--text)">Vider</button></div><div class="list">${player.up.map((id,i)=>{const t=lib.get(id);return `<div class="row"><span>${art(t.hue)}</span><span class="meta"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></span><div class="side"><button class="icon" data-act="unqueue" data-i="${i}" aria-label="Retirer ${esc(t.title)} de la file">✕</button></div></div>`}).join('')}</div>`:''}
  ${nextIds.length?`<div class="qlabel">Ensuite · ${esc(player.ctxName)}</div><div class="list">${nextIds.map(id=>trackRow(id,'queue')).join('')}</div>`:cur?`<div class="qlabel">Ensuite</div><div class="empty" style="padding-top:8px">${player.repeat==='all'?'La liste recommence au début.':'C’est le dernier titre de la liste.'}</div>`:''}`;
}

function render(){
  let h;
  if(route.v==='home')h=vHome();
  else if(route.v==='search')h=vSearch();
  else if(route.v==='library')h=vLibrary();
  else if(route.v==='coll')h=collection(route.k);
  else if(route.v==='queue')h=vQueue();
  view.innerHTML=h;
  const tabV=route.v==='coll'||route.v==='queue'?(stack.find(r=>['home','search','library'].includes(r.v))||{v:'home'}).v:route.v;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.v===tabV?'page':'false'));
  const q=$('#q');if(q)q.addEventListener('input',e=>{query=e.target.value;$('#results').innerHTML=searchResults()});
}
function refreshRows(){
  const cur=player.cur();
  document.querySelectorAll('.row[data-row]').forEach(r=>r.classList.toggle('on',!!cur&&r.dataset.row===cur.id));
  const bp=document.querySelector('.bigplay');if(bp&&route.v==='coll')bp.innerHTML=ic(player.ctxKey===route.k&&!audio.paused?'pause':'play');
}

function paintPlayer(){
  const t=player.cur(),playing=!audio.paused;
  $('#mini').hidden=!t;
  document.documentElement.style.setProperty('--mini-h',t?'64px':'0px');
  $('#miniPlay').innerHTML=$('#play').innerHTML=ic(playing?'pause':'play');
  $('#miniPlay').setAttribute('aria-label',playing?'Pause':'Lecture');$('#play').setAttribute('aria-label',playing?'Pause':'Lecture');
  $('#shuf').innerHTML=ic('shuffle');$('#rep').innerHTML=ic('repeat');
  $('#shuf').classList.toggle('active',player.shuffle);$('#shuf').setAttribute('aria-pressed',player.shuffle);
  $('#rep').classList.toggle('active',player.repeat!=='off');$('#rep').classList.toggle('one',player.repeat==='one');
  $('#rep').setAttribute('aria-label',{off:'Répéter : désactivé',all:'Répéter : la liste',one:'Répéter : ce titre'}[player.repeat]);
  refreshRows();
  if(!t)return;
  const L=lib.liked.has(t.id);
  $('#miniT').textContent=$('#bigT').textContent=t.title;
  $('#miniA').textContent=t.artist;$('#bigA').textContent=t.artist;
  $('#ctxName').textContent=player.ctxName||'Bibliothèque';
  $('#miniArt').style.background=$('#bigArt').style.background=artBg(t.hue);
  $('#glow').style.background=`radial-gradient(ellipse at 50% 0%,hsl(${t.hue} 80% 45%),transparent 70%)`;
  [$('#miniLike'),$('#bigLike')].forEach(b=>{b.innerHTML=ic(L?'heartOn':'heart');b.classList.toggle('liked',L);b.setAttribute('aria-label',L?'Retirer des titres likés':'Ajouter aux titres likés')});
}

function addToPlMenu(id){

function nameForm(mode,pid,tid){
  const p=pid?lib.pl(pid):null;
  openModal(`<div class="mtitle">${mode==='rename'?'Renommer la playlist':'Nouvelle playlist'}</div>
  <form class="form" id="nameForm" novalidate><input id="plName" maxlength="80" placeholder="Nom de la playlist" value="${esc(p?p.name:'Ma playlist n°'+(lib.playlists.length+1))}" aria-label="Nom de la playlist"><p class="err" id="plErr"></p>
  <div class="btns"><button type="button" class="pill ghost" data-act="m-close">Annuler</button><button type="submit" class="pill">${mode==='rename'?'Enregistrer':'Créer'}</button></div></form>`);
  const inp=$('#plName');inp.select();
  $('#nameForm').addEventListener('submit',e=>{
    e.preventDefault();const name=inp.value.trim();
    if(!name){$('#plErr').textContent='Donne un nom à ta playlist.';inp.focus();return}
    if(mode==='rename'){lib.renamePl(pid,name);closeModal();render();toast('Playlist renommée');return}
    const np=lib.createPl(name,tid);closeModal();
    if(tid){render();toast(`Ajouté à « ${name} »`)}else{go({v:'coll',k:'pl:'+np.id});toast('Playlist créée')}
  });
}
function plMenu(pid,confirm){
  const p=lib.pl(pid);if(!p)return;
  openModal(`<div class="mhead">${art(lib.plArt(p))}<div style="min-width:0"><b>${esc(p.name)}</b><span>${p.tracks.length} titre${p.tracks.length>1?'s':''}</span></div></div>
  ${confirm?`<p style="margin:10px 2px;line-height:1.5">Supprimer « ${esc(p.name)} » ? Les titres restent dans ta bibliothèque.</p><div class="form"><div class="btns"><button class="pill ghost" data-act="m-close">Annuler</button><button class="pill" style="background:var(--danger)" data-act="m-delpl-yes" data-p="${esc(pid)}">Supprimer</button></div></div>`
  :`<button class="mi" data-act="m-rename" data-p="${esc(pid)}">${ic('sort')}<span class="grow">Renommer</span></button>
  <button class="mi" data-act="m-queuepl" data-p="${esc(pid)}">${ic('queue')}<span class="grow">Ajouter à la file d’attente</span></button>
  <button class="mi danger" data-act="m-delpl" data-p="${esc(pid)}">✕<span class="grow">Supprimer la playlist</span></button>`}`);

  ${player.timerEnd||player.endOfTrack?`<button class="mi danger" data-act="m-timer" data-v="0">✕<span class="grow">Désactiver le minuteur</span></button>`:''}`);

function openPlayer(){if(!player.cur())return;$('#sheet').classList.add('open');$('#sheet').setAttribute('aria-hidden','false')}
function closePlayer(){$('#sheet').classList.remove('open');$('#sheet').setAttribute('aria-hidden','true')}
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2400)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.getAttribute('aria-disabled')==='true'&&b.dataset.act==='m-pick'){if(b)toast('Déjà dans cette playlist');return}
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'tab':closePlayer();tab(b.dataset.v);break;
    case 'open':go({v:'coll',k:b.dataset.k});break;
    case 'back':back();break;
    case 'play':{const c=ctxs[b.dataset.ctx];const cur=player.cur();
      if(cur&&cur.id===id&&player.ctxKey===b.dataset.ctx){toggle();break}
      if(b.dataset.ctx==='queue'){const i=player.ctx.indexOf(id,player.pos);if(i>=0){player.pos=i;load(id)}break}
      playContext(c?c.ids:[id],id,c?c.name:'',b.dataset.ctx);break}
    case 'play-ctx':{const k=b.dataset.ctx,c=ctxs[k];if(player.ctxKey===k&&player.cur()){toggle();break}playContext(c.ids,null,c.name,k);break}
    case 'more':trackMenu(id,b.dataset.ctx);break;
    case 'toggle':toggle();break;
    case 'next':next();break;
    case 'prev':prev();break;
    case 'shuffle':setShuffle(!player.shuffle);paintPlayer();if(route.v==='coll'||route.v==='queue')render();toast(player.shuffle?'Lecture aléatoire activée':'Lecture aléatoire désactivée');break;
    case 'repeat':player.repeat={off:'all',all:'one',one:'off'}[player.repeat];store.set('rep',player.repeat);paintPlayer();toast({off:'Répétition désactivée',all:'Répéter la liste',one:'Répéter ce titre'}[player.repeat]);break;
    case 'like-current':{const t=player.cur();if(t){const on=lib.toggleLike(t.id);paintPlayer();render();toast(on?'Ajouté aux titres likés':'Retiré des titres likés')}break}
    case 'more-current':{const t=player.cur();if(t)trackMenu(t.id,player.ctxKey)}break;
    case 'artist-current':{const t=player.cur();if(t){closePlayer();go({v:'coll',k:'artist:'+t.artist})}break}
    case 'open-player':openPlayer();break;
    case 'close-player':closePlayer();break;
    case 'queue':closePlayer();if(route.v!=='queue')go({v:'queue'});break;
    case 'timer':timerMenu();break;
    case 'clear-up':player.up=[];render();break;
    case 'unqueue':player.up.splice(+b.dataset.i,1);render();break;
    case 'new-pl':nameForm('create');break;
    case 'import':$('#files').click();break;
    case 'libf':libFilter=b.dataset.f;store.set('libf',libFilter);render();break;
    case 'libsort':libSort=libSort==='az'?'recent':'az';store.set('libs',libSort);render();break;
    case 'pl-menu':plMenu(id);break;
    case 'm-close':closeModal();break;
    case 'm-like':{const on=lib.toggleLike(id);closeModal();paintPlayer();render();toast(on?'Ajouté aux titres likés':'Retiré des titres likés');break}
    case 'm-addpl':addToPlMenu(id);break;
    case 'm-newpl':nameForm('create',null,id);break;
    case 'm-pick':{const p=lib.pl(b.dataset.p);lib.addTo(p.id,id);closeModal();render();toast(`Ajouté à « ${p.name} »`);break}
    case 'm-queue':player.up.push(id);closeModal();if(!player.cur()){next()}if(route.v==='queue')render();toast('Ajouté à la file d’attente');break;
    case 'm-artist':closeModal();closePlayer();go({v:'coll',k:'artist:'+lib.get(id).artist});break;
    case 'm-rmpl':{const p=lib.pl(b.dataset.p);lib.removeFrom(p.id,id);closeModal();render();toast(`Retiré de « ${p.name} »`);break}
    case 'm-delfile':{lib.tracks=lib.tracks.filter(t=>t.id!==id);idb.del(id);lib.playlists.forEach(p=>p.tracks=p.tracks.filter(x=>x!==id));lib.savePl();lib.liked.delete(id);store.set('liked',[...lib.liked]);player.up=player.up.filter(x=>x!==id);closeModal();render();toast('Fichier supprimé de ce téléphone');break}
    case 'm-rename':nameForm('rename',b.dataset.p);break;
    case 'm-queuepl':{const p=lib.pl(b.dataset.p);player.up.push(...p.tracks);closeModal();if(!player.cur())next();toast(`${p.tracks.length} titre${p.tracks.length>1?'s':''} ajouté${p.tracks.length>1?'s':''} à la file`);break}
    case 'm-delpl':plMenu(b.dataset.p,true);break;
    case 'm-delpl-yes':{const p=lib.pl(b.dataset.p);lib.deletePl(p.id);closeModal();if(route.v==='coll'&&route.k==='pl:'+p.id)back();else render();toast(`« ${p.name} » supprimée`);break}
    case 'm-timer':{const v=b.dataset.v;setTimer(v==='end'?'end':+v);closeModal();toast(v==='0'?'Minuteur désactivé':v==='end'?'Arrêt à la fin du titre':`Arrêt dans ${b.querySelector('.grow').textContent}`);break}
  }
});

$('#files').addEventListener('change',e=>{
  const fs=[...e.target.files];if(!fs.length)return;
  fs.forEach(f=>{
    const base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
    const parts=base.split(/\s+-\s+/);
    const t={id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:(parts[1]||parts[0]).trim(),artist:parts[1]?parts[0].trim():'Artiste inconnu',hue:hueOf(base),blob:f,demo:false,url:null,dur:NaN,mood:null};
    lib.tracks.unshift(t);idb.put({id:t.id,title:t.title,artist:t.artist,hue:t.hue,blob:f});
    const probe=new Audio();probe.preload='metadata';probe.src=URL.createObjectURL(f);probe.onloadedmetadata=()=>{t.dur=probe.duration;URL.revokeObjectURL(probe.src)};
  });
  e.target.value='';closePlayer();stack=[{v:'library'}];route={v:'coll',k:'files'};render();
  toast(fs.length+(fs.length>1?' titres ajoutés':' titre ajouté'));
});

if(tg&&tg.initData!==undefined){
  try{tg.ready();tg.expand();tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000');if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){}
  const syncBack=()=>{try{const open=$('#sheet').classList.contains('open')||!scrim.hidden||stack.length>0;open?tg.BackButton.show():tg.BackButton.hide()}catch(e){}};
  tg.BackButton.onClick(()=>{if(!scrim.hidden)closeModal();else if($('#sheet').classList.contains('open'))closePlayer();else back();syncBack()});
  const baseRender=render;render=function(){baseRender();syncBack()};
  document.addEventListener('click',()=>setTimeout(syncBack,0));
  document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&tg.HapticFeedback){try{tg.HapticFeedback.selectionChanged()}catch(err){}}},true);
  syncBack();
}

idb.open().then(idb.all).then(saved=>{if(!saved.length)return;saved.sort((a,b)=>a.id<b.id?-1:1).forEach(s=>lib.tracks.unshift({...s,demo:false,url:null,dur:NaN,mood:null}));
  saved.forEach(s=>{const t=lib.get(s.id);const pr=new Audio();pr.preload='metadata';pr.src=URL.createObjectURL(s.blob);pr.onloadedmetadata=()=>{t.dur=pr.duration;URL.revokeObjectURL(pr.src)}});
  render()});
})();
</script>
